  <style>

    const STORAGE_KEY = "saudi-water-saver-v1";
    const blankState = () => ({ screen: "home", lang: "en", qIndex: 0, answers: {}, profile: { name: "", goal: 3000 }, history: { lifetime: 0, monthly: 0, monthKey: "", streak: 0, lastCheckin: "" }, enabled: {}, challengeTab: "schools", hasCalculated: false, message: "" });
    let state = blankState();
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) state = { ...state, ...JSON.parse(stored) };
    } catch (_) { /* Keep the in-memory state when browser storage is unavailable. */ }

    const app = document.getElementById("app");
    const text = (key) => UI[state.lang][key] || UI.en[key] || key;
    const locale = () => state.lang === "ar" ? "ar-SA" : "en-US";
    const number = (value) => Math.round(value || 0).toLocaleString(locale());
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
    const todayKey = () => {
      const date = new Date();
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    };
    const monthKey = () => todayKey().slice(0, 7);
    const persist = () => {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) { /* State remains available for this visit. */ }
    };
    const householdCount = () => CONFIG.peopleCount[state.answers.household] || 1;

    function calculate(answers = state.answers) {
      const people = CONFIG.peopleCount[answers.household] || 0;
      const showerers = CONFIG.peopleCount[answers.showerers] || Number(answers.showerers) || 0;
      const minutes = CONFIG.showerMinutes[answers.minutes] || 0;
      const toiletUses = CONFIG.toiletUsesPerPersonPerDay[answers.toilet] || 0;
      const loads = CONFIG.laundryLoadsPerWeek[answers.laundry] || 0;
      const washes = CONFIG.carWashesPerMonth[answers.carFrequency] || 0;
      const waterings = CONFIG.gardenWateringsPerWeek[answers.garden] || 0;
      const categories = {
        shower: showerers * minutes * CONFIG.showerLitresPerMinute,
        toilet: people * toiletUses * CONFIG.toiletLitresPerFlush,
        laundry: loads * CONFIG.laundryLitresPerLoad / 7,
        car: washes * (CONFIG.carLitresPerWash[answers.carMethod] || 0) / CONFIG.daysPerMonth,
        garden: waterings * CONFIG.litresPerWatering / 7,
        other: people * CONFIG.otherLitresPerPersonPerDay
      };
      return { categories, total: Object.values(categories).reduce((sum, value) => sum + value, 0), people, showerers, minutes, loads, washes, waterings };
    }

    function suggestionsFor() {
      const calc = calculate();
      const answers = state.answers;
      const ideas = [];
      const add = (idea) => ideas.push(idea);
      if (calc.minutes > 5 && calc.showerers > 0) {
        const target = calc.minutes > 15 ? 15 : calc.minutes > 10 ? 10 : 5;
        add({ id: "shower", emoji: "🚿", title: text("showerTitle"), from: `${calc.minutes} min`, to: `${target} min`, saved: calc.showerers * (calc.minutes - target) * CONFIG.showerLitresPerMinute });
      }
      if (calc.categories.toilet > 0) add({ id: "toilet", emoji: "🚽", title: text("toiletTitle"), from: text("current"), to: "Dual-flush / fix leaks", saved: calc.categories.toilet * .25 });
      if (calc.loads >= 4) add({ id: "laundry", emoji: "🧺", title: text("laundryTitle"), from: `${calc.loads} loads/week`, to: `${Math.max(1, calc.loads - 2)} loads/week`, saved: 2 * CONFIG.laundryLitresPerLoad / 7 });
      if (calc.washes > 0) {
        let carIdea = null;
        if (answers.carMethod === "hose") carIdea = { from: text("hose"), to: text("bucket"), saved: calc.washes * (CONFIG.carLitresPerWash.hose - CONFIG.carLitresPerWash.bucket) / CONFIG.daysPerMonth };

          const halfSaved = calc.washes * CONFIG.carLitresPerWash[answers.carMethod] / 2 / CONFIG.daysPerMonth;
          if (!carIdea || halfSaved > carIdea.saved) carIdea = { from: `${calc.washes}× / month`, to: `${calc.washes / 2}× / month`, saved: halfSaved };
        }
        if (carIdea) add({ id: "car", emoji: "🚗", title: text("carTitle"), ...carIdea });
      }
      if (answers.garden === "daily") add({ id: "garden", emoji: "🌱", title: text("gardenTitle"), from: text("daily"), to: state.lang === "ar" ? "يوماً بعد يوم" : "Every other day", saved: 50, tip: text("dawn") });
      if (answers.garden === "sometimes") add({ id: "garden", emoji: "🌱", title: text("gardenTitle"), from: text("sometimes"), to: state.lang === "ar" ? "مرتان أسبوعياً" : "2× / week", saved: CONFIG.litresPerWatering / 7, tip: text("dawn") });
      if (calc.categories.other > 0) add({ id: "tap", emoji: "🚰", title: text("tapTitle"), from: text("current"), to: text("tapTip"), saved: calc.categories.other * .1, tip: text("tapTip") });
      return ideas.filter((idea) => idea.saved > 0).sort((a, b) => b.saved - a.saved).slice(0, 3).map((idea) => {
        if (!(idea.id in state.enabled)) state.enabled[idea.id] = true;
        return idea;
      });
    }

    function appliedSavings(ideas = suggestionsFor()) {
      return ideas.reduce((sum, idea) => sum + (state.enabled[idea.id] ? idea.saved : 0), 0);
    }

    function updateMonth() {
      const current = monthKey();
      if (state.history.monthKey !== current) {
        state.history.monthly = 0;

      return QUESTIONS.map((question, index) => question.id === "carMethod" && state.answers.carFrequency === "never" ? -1 : index).filter((index) => index >= 0);

      const indexes = visibleQuestionIndexes();
      const index = indexes[Math.min(state.qIndex, indexes.length - 1)] || 0;
      const question = QUESTIONS[index];
      const answers = question.id === "showerers" ? question.options.slice(0, Math.max(1, householdCount() - (state.answers.household === "5+" ? 1 : 0))) : question.options;

      }).join("");
      const progress = Math.round(position / indexes.length * 100);

      const top = CATEGORY_META.filter((item) => calc.categories[item.id] > 0).sort((a, b) => calc.categories[b.id] - calc.categories[a.id])[0];

    function resultsView() {
      const calc = calculate();
      const items = CATEGORY_META.filter((item) => calc.categories[item.id] > 0);
      const max = Math.max(...items.map((item) => calc.categories[item.id]), 1);

        return `<div class="chart-row"><span class="chart-name"><span>${item.emoji}</span>${escapeHtml(item.name[state.lang])}</span><div class="chart-track" role="img" aria-label="${escapeHtml(item.name[state.lang])}: ${number(value)} litres, ${pct}%"><div class="chart-fill" style="width:${value / max * 100}%;--bar-color:${item.color}"></div></div><span class="chart-value"><strong>${number(value)} L/day</strong> · ${pct}%</span></div>`;
      }).join("");
      return `<section class="page"><div class="result-heading"><div><p class="eyebrow">${escapeHtml(text("estimate"))}</p><h1>${escapeHtml(text("resultTitle"))}</h1><p>${escapeHtml(text("homeNote"))}</p></div><button class="btn btn-secondary" data-action="edit-habits">✎ ${escapeHtml(text("updateHabits"))}</button></div><div class="result-grid"><div class="panel total-panel"><p class="total-label">${escapeHtml(text("resultTitle"))}</p><p class="big-total" aria-live="polite">${number(calc.total)} <span class="total-unit">${escapeHtml(text("day"))}</span></p><p class="total-subline">≈ ${number(calc.total * CONFIG.daysPerMonth)} ${escapeHtml(text("month"))}</p><span class="per-person">≈ ${number(calc.total / Math.max(calc.people, 1))} L ${escapeHtml(text("perPerson"))}</span></div><div class="panel insight-panel"><div><span class="insight-icon">💡</span><p class="eyebrow" style="margin-top:18px">${escapeHtml(text("insight"))}</p><p class="insight-copy">${escapeHtml(insight(calc))}</p></div><button class="btn" data-screen="less">${escapeHtml(text("makeLess"))}</button></div><div class="panel chart-panel"><h2>${escapeHtml(text("breakdown"))}</h2><div class="chart-list">${rows}</div></div></div>${assumptions()}<div class="action-row"><button class="btn" data-screen="less">${escapeHtml(text("makeLess"))}</button></div></section>`;
    }

    function suggestionsCards(ideas) {
      if (!ideas.length) return `<p class="doing-great">${escapeHtml(text("great"))}</p>`;
      return `<div class="suggestion-list">${ideas.map((idea) => {
        const on = !!state.enabled[idea.id];
        return `<article class="suggestion ${on ? "" : "off"}"><div class="suggestion-head"><h3 class="suggestion-title"><span class="suggestion-emoji">${idea.emoji}</span>${escapeHtml(idea.title)}</h3><button class="switch" type="button" role="switch" aria-checked="${on}" aria-label="${escapeHtml(text("apply"))}: ${escapeHtml(idea.title)}" data-action="toggle" data-id="${idea.id}"></button></div><p class="suggestion-change"><strong>${escapeHtml(text("current"))}:</strong> ${escapeHtml(idea.from)} → <strong>${escapeHtml(text("try"))}:</strong> ${escapeHtml(idea.to)}</p><p class="saving">${escapeHtml(text("potential"))}: 💧 ${number(idea.saved)} L/day (${number(idea.saved * CONFIG.daysPerMonth)} L/month)</p>${idea.tip ? `<p class="tip">${escapeHtml(idea.tip)}</p>` : ""}</article>`;
      }).join("")}</div>`;
    }

    function lessView() {
      const ideas = suggestionsFor();
      return `<section class="page"><div class="section-heading"><div><p class="eyebrow">${escapeHtml(text("makeLess"))}</p><h1>${escapeHtml(text("savingIdeas"))}</h1><p>${escapeHtml(text("savingIntro"))}</p></div></div>${suggestionsCards(ideas)}<div class="action-row"><button class="btn" data-screen="before">${escapeHtml(text("beforeAfter"))}</button><button class="btn btn-secondary" data-screen="results">${escapeHtml(text("results"))}</button></div></section>`;
    }

    function beforeView() {
      const calc = calculate();
      const ideas = suggestionsFor();
      const saved = appliedSavings(ideas);
      const after = Math.max(0, calc.total - saved);
      const percent = calc.total ? Math.round(saved / calc.total * 100) : 0;
      const tubs = Math.round(saved * CONFIG.daysPerMonth / CONFIG.bathtubLitres);
      return `<section class="page"><div class="section-heading"><div><p class="eyebrow">${escapeHtml(text("beforeAfter"))}</p><h1>${escapeHtml(text("savingIdeas"))}</h1><p>${escapeHtml(text("savingIntro"))}</p></div></div>${suggestionsCards(ideas)}<div class="compare-panel" aria-live="polite"><div class="compare-values"><div class="compare-value"><span class="compare-caption">${escapeHtml(text("before"))}</span><strong class="compare-number"><span data-count="${calc.total}">${number(calc.total)}</span> <small>L/day</small></strong></div><span class="compare-arrow" aria-hidden="true">⬇️</span><div class="compare-value"><span class="compare-caption">${escapeHtml(text("after"))}</span><strong class="compare-number"><span data-count="${after}">${number(after)}</span> <small>L/day</small></strong></div></div><p class="save-callout">🎉 ${escapeHtml(text("youCouldSave"))} <span data-count="${saved}">${number(saved)}</span> L/day ≈ <span data-count="${saved * CONFIG.daysPerMonth}">${number(saved * CONFIG.daysPerMonth)}</span> ${escapeHtml(text("monthly"))} (${percent}% ${escapeHtml(text("percent"))})</p><p class="bathtub">${escapeHtml(text("bathtub"))} ${number(tubs)} ${escapeHtml(text("bathtubs"))} (1 bathtub = ${CONFIG.bathtubLitres} L).</p></div><div class="action-row"><button class="btn" data-screen="dashboard">${escapeHtml(text("plan"))}</button><button class="btn btn-secondary" data-screen="less">${escapeHtml(text("makeLess"))}</button></div></section>`;
    }

    function dashboardView() {
      updateMonth();
      const calc = calculate();
      const daily = appliedSavings();
      const goal = Math.max(Number(state.profile.goal) || 3000, 1);
      const progress = Math.min(100, state.history.monthly / goal * 100);
      const checkedToday = state.history.lastCheckin === todayKey();
      return `<section class="page"><div class="section-heading"><div><p class="eyebrow">${escapeHtml(text("profile"))}</p><h1>${escapeHtml(text("dashboard"))}</h1><p>${escapeHtml(text("savedDevice"))}</p></div></div><div class="dashboard-grid"><div class="metric"><span class="metric-label">💧 ${escapeHtml(text("savedLifetime"))}</span><strong class="metric-value">${number(state.history.lifetime)} <small>L</small></strong></div><div class="metric"><span class="metric-label">📅 ${escapeHtml(text("savedMonth"))}</span><strong class="metric-value">${number(state.history.monthly)} <small>L</small></strong></div><div class="metric"><span class="metric-label">🔥 ${escapeHtml(text("streak"))}</span><strong class="metric-value">${number(state.history.streak)} <small>${escapeHtml(text("days"))}</small></strong></div><div class="metric"><span class="metric-label">🎯 ${escapeHtml(text("monthlyGoal"))}</span><strong class="metric-value">${number(goal)} <small>L</small></strong></div></div><div class="goal-panel"><div class="goal-row"><h3>${escapeHtml(text("monthlyGoal"))}</h3><p>${number(state.history.monthly)} / ${number(goal)} L · ${number(progress)}% ${escapeHtml(text("goalProgress"))}</p></div><div class="goal-track" role="progressbar" aria-valuenow="${Math.round(progress)}" aria-valuemin="0" aria-valuemax="100"><div class="goal-fill" style="width:${progress}%"></div></div><div class="profile-fields"><label class="field">${escapeHtml(text("profileName"))}<input type="text" maxlength="50" data-field="name" value="${escapeHtml(state.profile.name)}" placeholder="${escapeHtml(text("namePlaceholder"))}"></label><label class="field">${escapeHtml(text("goalLitres"))}<input type="number" min="1" step="100" data-field="goal" value="${escapeHtml(state.profile.goal)}"></label></div><p class="device-note">${escapeHtml(text("savedDevice"))}</p></div><div class="checkin-panel"><div><h3>${escapeHtml(text("checkinTitle"))}</h3><p>${escapeHtml(text("checkinText"))} <strong>${number(daily)} L/day</strong>.</p></div><button class="btn" data-action="checkin" ${checkedToday ? "disabled" : ""}>${checkedToday ? escapeHtml(text("checked")) : escapeHtml(text("checkin"))}</button></div><div class="settings-panel"><button class="btn btn-secondary" data-action="edit-habits">${escapeHtml(text("updateHabits"))}</button><button class="btn-quiet text-danger" data-action="reset">${escapeHtml(text("reset"))}</button></div></section>`;
    }

    function challengeView() {
      updateMonth();
      const goal = Math.max(Number(state.profile.goal) || 3000, 1);
      const now = new Date();
      const monthDays = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      const daysLeft = monthDays - now.getDate();
      const paceTarget = goal * now.getDate() / monthDays;
      const progress = Math.min(100, state.history.monthly / goal * 100);
      const leaders = SAMPLE_LEADERS[state.challengeTab] || SAMPLE_LEADERS.schools;
      const rows = leaders.map((leader, index) => {
        const name = leader.own && state.profile.name ? state.profile.name : leader.own ? text("yourHome") : leader.name;
        const value = leader.own ? state.history.monthly : leader.value;
        return `<div class="leader-row ${leader.own ? "own" : ""}"><span class="leader-rank">${String(index + 1).padStart(2, "0")}</span><strong>${escapeHtml(name)}</strong><strong>${number(value)} L</strong></div>`;
      }).join("");
      const tabs = [["schools", text("schools")], ["households", text("households")], ["communities", text("communities")]].map(([id, label]) => `<button class="tab" role="tab" aria-selected="${state.challengeTab === id}" data-action="tab" data-tab="${id}">${escapeHtml(label)}</button>`).join("");
      const goalPresets = [1000, 2000, 3000, 5000].map((value) => `<button class="goal-chip ${goal === value ? "active" : ""}" data-action="goal" data-goal="${value}">${number(value)} L</button>`).join("");
      return `<section class="page"><div class="section-heading"><div><p class="eyebrow">🇸🇦 ${escapeHtml(text("challengeTitle"))}</p><h1>${escapeHtml(text("challenge"))}</h1><p>${escapeHtml(text("challengeText"))}</p></div></div><div class="challenge-top"><div class="challenge-callout"><h2>${escapeHtml(text("challengeTitle"))}</h2><p>${escapeHtml(text("challengeText"))}</p><div class="challenge-progress"><div class="goal-row"><strong>${number(state.history.monthly)} / ${number(goal)} L</strong><span>${number(daysLeft)} ${escapeHtml(text("daysLeft"))}</span></div><div class="goal-track"><div class="goal-fill" style="width:${progress}%"></div></div><p class="status-line" style="color:#d5e7e0">${state.history.monthly >= paceTarget ? escapeHtml(text("onTrack")) : escapeHtml(text("behind"))}</p></div></div><div class="challenge-goal"><h3>🎯 ${escapeHtml(text("goalSet"))}</h3><div class="goal-controls">${goalPresets}</div><form data-form="custom-goal" class="profile-fields" style="grid-template-columns:1fr auto;align-items:end;margin-top:10px"><label class="field">${escapeHtml(text("custom"))}<input type="number" name="customGoal" min="1" step="1" value="${escapeHtml(goal)}"></label><button class="btn btn-secondary" type="submit">${escapeHtml(text("setGoal"))}</button></form></div></div><div class="leaderboard"><div class="tab-list" role="tablist">${tabs}</div><p class="sample-label">${escapeHtml(text("sample"))}</p><div class="leader-list" role="tabpanel">${rows}</div></div></section>`;
    }

    function render() {
      if (state.hasCalculated && !["home", "questions"].includes(state.screen)) suggestionsFor();
      const views = { home: homeView, questions: questionView, results: resultsView, less: lessView, before: beforeView, dashboard: dashboardView, challenge: challengeView };
      app.innerHTML = `${header()}<main>${(views[state.screen] || homeView)()}</main><footer>${escapeHtml(text("estimate"))}</footer>`;
      document.documentElement.lang = state.lang;
      document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
      animateCounts();
      persist();
    }

    function animateCounts() {
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      app.querySelectorAll("[data-count]").forEach((element) => {
        const target = Number(element.dataset.count);
        if (reducedMotion) {
          element.textContent = number(target);
          return;
        }
        const startedAt = performance.now();
        const duration = 520;
        const tick = (now) => {
          const progress = Math.min((now - startedAt) / duration, 1);
          element.textContent = number(target * progress);
          if (progress < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      });
    }

    function startQuestions() {
      state.answers = state.hasCalculated ? { ...state.answers } : {};
      state.qIndex = 0;
      state.screen = "questions";
      state.message = "";
      render();
    }

    function nextQuestion() {
      const indexes = visibleQuestionIndexes();
      if (state.qIndex >= indexes.length - 1) {
        state.hasCalculated = true;
        state.screen = "results";
        suggestionsFor();
      } else {
        state.qIndex += 1;
        if (QUESTIONS[indexes[state.qIndex]]?.id === "carMethod" && state.answers.carFrequency === "never") state.qIndex += 1;
      }
      render();
    }

    app.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.screen) {
        if (button.dataset.screen === "results" && !state.hasCalculated) return;
        state.screen = button.dataset.screen;
        render();
        return;
      }
      const action = button.dataset.action;
      if (action === "language") { state.lang = state.lang === "en" ? "ar" : "en"; render(); }
      if (action === "start") startQuestions();
      if (action === "answer") {
        const { question, value } = button.dataset;
        state.answers[question] = value;
        if (question === "household") {
          const max = value === "5+" ? 5 : Number(value);
          if (Number(state.answers.showerers) > max) state.answers.showerers = String(max);
        }
        if (question === "carFrequency" && value === "never") delete state.answers.carMethod;
        render();
        nextQuestion();
      }
      if (action === "back") {
        if (state.qIndex === 0) state.screen = "home";
        else {
          const indexes = visibleQuestionIndexes();
          state.qIndex = Math.min(state.qIndex - 1, indexes.length - 1);
        }
        render();
      }
      if (action === "toggle") { state.enabled[button.dataset.id] = !state.enabled[button.dataset.id]; render(); }
      if (action === "tab") { state.challengeTab = button.dataset.tab; render(); }
      if (action === "goal") { state.profile.goal = Number(button.dataset.goal); render(); }
      if (action === "edit-habits") { startQuestions(); }
      if (action === "checkin") {
        const today = todayKey();
        if (state.history.lastCheckin !== today) {
          const yesterdayDate = new Date();
          yesterdayDate.setDate(yesterdayDate.getDate() - 1);
          const yesterday = `${yesterdayDate.getFullYear()}-${String(yesterdayDate.getMonth() + 1).padStart(2, "0")}-${String(yesterdayDate.getDate()).padStart(2, "0")}`;
          state.history.streak = state.history.lastCheckin === yesterday ? state.history.streak + 1 : 1;
          const dailySaved = appliedSavings();
          state.history.lifetime += dailySaved;
          state.history.monthly += dailySaved;
          state.history.monthKey = monthKey();
          state.history.lastCheckin = today;
          render();
        }
      }
      if (action === "reset" && window.confirm(text("resetConfirm"))) {
        state = blankState();
        try { localStorage.removeItem(STORAGE_KEY); } catch (_) { /* The in-memory profile is still reset. */ }
        render();
      }
    });

    app.addEventListener("input", (event) => {
      const field = event.target.dataset.field;
      if (field === "name") { state.profile.name = event.target.value; persist(); }
      if (field === "goal") {
        const value = Number(event.target.value);
        if (value > 0) { state.profile.goal = value; persist(); }
      }
    });
    app.addEventListener("change", (event) => {
      const field = event.target.dataset.field;
      if (field === "name") { state.profile.name = event.target.value; render(); }
      if (field === "goal") {
        const value = Number(event.target.value);
        if (value > 0) { state.profile.goal = value; render(); }
      }
    });
    app.addEventListener("submit", (event) => {
      if (event.target.dataset.form !== "custom-goal") return;
      event.preventDefault();
      const value = Number(new FormData(event.target).get("customGoal"));
      if (value > 0) { state.profile.goal = value; render(); }
    });

    render();
  </script>
</body>
</html>
